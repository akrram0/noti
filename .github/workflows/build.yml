name: Build & Package Noti

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.50 or v1.0.50). Defaults to 1.0.<run_number>.'
        required: false
        type: string
      release_notes:
        description: 'Optional release notes for the GitHub Release.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Build Version
        id: meta
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $inputVer = "$env:INPUT_VERSION".Trim()
          if (![string]::IsNullOrWhiteSpace($inputVer)) {
            $ver = $inputVer.TrimStart('v', 'V')
          } else {
            $ver = "1.0.${{ github.run_number }}"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
          "tag=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8

      - name: Run Core & Storage unit tests
        run: dotnet test Noti.Tests/Noti.Tests.csproj --configuration Release --verbosity normal

      - name: Publish Noti.App (win-x64, self-contained, unpackaged)
        run: >
          dotnet publish Noti.App/Noti.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=${{ steps.meta.outputs.version }}
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output "${{ runner.temp }}/noti-publish"

      - name: Build Windows Setup Installer (Noti-Setup-win-x64.exe)
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          Remove-Item -Path "${{ runner.temp }}/noti-publish/*.pdb" -Force -ErrorAction SilentlyContinue
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$ver" "/DPublishDir=${{ runner.temp }}\noti-publish" "/DOutputDir=${{ github.workspace }}" "installer\noti.iss"
          @{
            version = $ver
            downloadUrl = "https://github.com/akrram0/noti/releases/latest/download/Noti-Setup-win-x64.exe"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Path "${{ github.workspace }}/version.json" -Encoding UTF8

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noti-Setup-win-x64
          path: |
            ${{ github.workspace }}/Noti-Setup-win-x64.exe
            ${{ github.workspace }}/version.json
          if-no-files-found: error

      - name: Publish Latest Release & Prune Older Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $versionTag = "${{ steps.meta.outputs.tag }}"
          $installer = "${{ github.workspace }}/Noti-Setup-win-x64.exe"
          $manifest = "${{ github.workspace }}/version.json"
          $title = "Noti v$ver Setup (win-x64)"
          $notes = if (![string]::IsNullOrWhiteSpace($env:INPUT_NOTES)) { $env:INPUT_NOTES } else { "Automated Windows Setup installer for Noti v$ver." }

          # 1. Atomically publish the new release and mark it as Latest first (zero 404 window for AppUpdater)
          gh release view $versionTag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $versionTag $installer $manifest --title $title --notes $notes --latest
          } else {
            gh release upload $versionTag $installer $manifest --clobber
            gh release edit $versionTag --title $title --notes $notes --latest
          }

          # 2. Delete all older releases and their git tags so only the single latest release remains
          $existingTags = gh release list --limit 100 --json tagName --jq ".[].tagName"
          foreach ($oldTag in $existingTags) {
            if (![string]::IsNullOrWhiteSpace($oldTag) -and $oldTag -ne $versionTag) {
              gh release delete $oldTag --yes --cleanup-tag 2>$null
            }
          }
