name: Build & Package Noti

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Core & Storage unit tests
        run: dotnet test Noti.Tests/Noti.Tests.csproj --configuration Release --verbosity normal

      - name: Publish Noti.App (win-x64, self-contained, unpackaged)
        run: >
          dotnet publish Noti.App/Noti.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=1.0.${{ github.run_number }}
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:DebugType=none
          -p:DebugSymbols=false
          --output "${{ runner.temp }}/noti-publish"

      - name: Build Windows Setup Installer (Noti-Setup-win-x64.exe)
        shell: pwsh
        run: |
          Remove-Item -Path "${{ runner.temp }}/noti-publish/*.pdb" -Force -ErrorAction SilentlyContinue
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "/DPublishDir=${{ runner.temp }}\noti-publish" "/DOutputDir=${{ github.workspace }}" "installer\noti.iss"
          @{
            version = "1.0.${{ github.run_number }}"
            downloadUrl = "https://github.com/akrram0/noti/releases/latest/download/Noti-Setup-win-x64.exe"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json | Set-Content -Path "${{ github.workspace }}/version.json" -Encoding UTF8

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noti-Setup-win-x64
          path: ${{ github.workspace }}/Noti-Setup-win-x64.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases (v1.0.<run_number> & latest)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "1.0.${{ github.run_number }}"
          $versionTag = "v$ver"
          $latestTag = "latest"
          $installer = "${{ github.workspace }}/Noti-Setup-win-x64.exe"
          $manifest = "${{ github.workspace }}/version.json"
          $title = "Noti v$ver Setup (win-x64)"
          $notes = "Automated Windows Setup installer for Noti v$ver."

          # 1. Create a separate release for this build version (v1.0.<run_number>) and mark it as Latest
          gh release view $versionTag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $versionTag $installer $manifest --title $title --notes $notes --latest
          } else {
            gh release edit $versionTag --title $title --notes $notes --latest
            gh release upload $versionTag $installer $manifest --clobber
          }

          # 2. Keep the rolling 'latest' tag updated for direct tag links
          gh release view $latestTag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $latestTag $installer $manifest --title "Noti Latest ($versionTag)" --notes $notes --latest=false
          } else {
            gh release edit $latestTag --title "Noti Latest ($versionTag)" --notes $notes --latest=false
            gh release upload $latestTag $installer $manifest --clobber
          }
